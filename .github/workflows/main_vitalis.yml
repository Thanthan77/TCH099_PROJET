name: Build and deploy PHP app to Azure Web App - cliniqueprive

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

   
      - name: Upload artifact (web)
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: web/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./build            

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: cliniqueprive
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CLINIQUEPRIVE }}
          package: ./build        
